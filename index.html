const CRY={TH:2.0,P:.75};
function crClean(f,g){g.vl=undefined;if(!(amb&&amb.g===g))g.rise=0;g.fly=false;g.cfx=null;g.kb=0;g.ts=1.7;g.sc=1.7;f.cfx=null;f.ff=0}

 if(e.d===undefined){e.gx0=g.x;const d0=Math.sign(g.x-f.x)||1;e.d=(g.x+d0*330>990||g.x+d0*330<90)?-d0:d0;e.h={};

function crysCluster(x,by,dir,S,p,al,sd){if(p<=.01||al<=.01)return;ctx.save();ctx.globalAlpha=al;ctx.lineJoin='round';

  ctx.fillStyle='rgba(20,60,140,.32)';ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx+w*.6,by+(ty-by)*.35);ctx.lineTo(bx+w,by);ctx.lineTo(bx,by);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(bx-w*.4,by+(ty-by)*.2);ctx.lineTo(tx-1,ty+(by-ty)*.12);ctx.stroke()});
